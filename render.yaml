# Render Blueprint — deploys the Sospana Sonke backend for free in Frankfurt.
# Live host: https://sospana-sonke-api-fra.onrender.com
# In Render: New ▸ Blueprint ▸ pick your repo. Render reads this file and creates
# the service. You then paste a few values (marked sync:false) in the dashboard.
#
# Database: create a free Postgres on Neon (neon.tech) and paste its connection
# string into DATABASE_URL. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: sospana-sonke-api-fra
    runtime: python
    region: frankfurt
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    # One process fits the free 512 MB instance. A second worker would copy the
    # SQLAlchemy pool and the imported app. uvloop + httptools ship with
    # uvicorn[standard]. limit-concurrency keeps a stampede from spawning more
    # threads than the 5+2 DB pool can serve. timeout-keep-alive frees idle sockets.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --loop uvloop --http httptools --timeout-keep-alive 5 --limit-concurrency 40
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"              # wheels exist for all deps on 3.12 (fixes build)
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false                 # Neon *pooled* string (hostname contains -pooler). This service runs in Frankfurt; the closest Neon region is AWS eu-central-1. Moving a Neon project is a manual dashboard step.
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false                 # your Gmail address
      - key: SMTP_PASSWORD
        sync: false                 # Gmail App Password (2FA required), NOT the account password
      - key: LOGIN_ALERT_EMAIL
        sync: false                 # optional: who gets an email on every login (defaults to SMTP_USER)
      - key: EMAIL_FROM
        sync: false                 # e.g. Sospana Sonke <youraddress@gmail.com>
      - key: NOTIFY_EMAILS
        value: "true"
      - key: PUBLIC_API_URL
        value: https://sospana-sonke-api-fra.onrender.com
      - key: CRON_SECRET
        sync: false                 # long random string; set the SAME value as the GitHub repo secret CRON_SECRET.
                                     # Enables scheduled scraping (.github/workflows/scrape.yml). Until set, the cron endpoint is 404 (off).
      - key: JS_RENDER_ENABLED
        value: "false"              # headless-browser scraping off — Render's free tier can't run Chromium. Turn on only on a paid instance.
