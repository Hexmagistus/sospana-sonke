# Render Blueprint — deploys the Sospana Sonke backend for free.
# In Render: New ▸ Blueprint ▸ pick your repo. Render reads this file and creates
# the service. You then paste a few values (marked sync:false) in the dashboard.
#
# Database: create a free Postgres on Neon (neon.tech) and paste its connection
# string into DATABASE_URL. The frontend is deployed separately on Vercel.
services:
  - type: web
    name: sospana-sonke-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"              # wheels exist for all deps on 3.12 (fixes build)
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
