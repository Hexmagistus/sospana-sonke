name: Scan careers pages

# Runs the parallel scanner directly on the GitHub runner against the production
# database (no Render gateway timeout, headless Chromium available for
# JS-rendered careers pages). Requires repository secret DATABASE_URL (the Neon
# connection string, same value as on Render).

on:
  schedule:
    - cron: "0 * * * *"      # hourly (UTC); GitHub may delay or skip some runs
  workflow_dispatch:
    inputs:
      limit:
        description: "Max companies to scan"
        default: "400"
      workers:
        description: "Concurrent scans"
        default: "8"

# Never let two scans overlap and fight over the same rows.
concurrency:
  group: careers-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install headless Chromium (for JS-rendered careers pages)
        run: python -m playwright install --with-deps chromium

      - name: Scan due companies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JS_RENDER_ENABLED: "true"
          URL_TEST_TIMEOUT_SECONDS: "8"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL repo secret is not set - add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python scripts/run_scan.py \
            --limit "${{ github.event.inputs.limit || '400' }}" \
            --workers "${{ github.event.inputs.workers || '8' }}" \
            --max-seconds 2400
