name: Scan careers pages

# Asks the Render API to scan the next batch of careers pages and to close
# listings whose own closing date has passed. The runner never talks to the
# database, so GitHub does not need DATABASE_URL and does not install Chromium.
# Render's free plan cannot run a browser either; JS_RENDER_ENABLED stays off.
#
# GitHub's cron is best-effort. A */15 schedule can slip by minutes, and a
# cold Render instance can take about a minute to wake. A public JSON board
# is scanned again about an hour after its last success. Ordinary HTML pages
# wait about six hours. Each scan_due_companies call stops after about 55
# seconds and will not start a company unless 20 seconds remain, so this
# job's 100 second curl limit is not what cuts the run off.
#
# ONE-TIME SETUP — the same secret in both places:
#   1. Render dashboard → sospana-sonke-api-fra → Environment →
#      CRON_SECRET = a long random string
#   2. GitHub → Settings → Secrets and variables → Actions →
#      New repository secret → name CRON_SECRET, the same value
# This job fails on purpose until that secret exists. The API returns 404
# when CRON_SECRET is unset on Render, and 401 when the two values differ.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: careers-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            echo "Use the same value as Render → sospana-sonke-api-fra → Environment → CRON_SECRET."
            echo "The scanner calls the API. It does not need a DATABASE_URL secret in GitHub."
            exit 1
          fi

      - name: Wake the API (Render free tier sleeps when idle)
        run: |
          curl -sS --max-time 90 -o /dev/null -w "wake status=%{http_code} time=%{time_total}s\n" \
            https://sospana-sonke-api-fra.onrender.com/health || echo "Wake timed out; the next step still tries."
          sleep 5

      - name: Scan the next batch and close expired listings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          fail=0
          for job in scan_due_companies close_expired_vacancies; do
            code=$(curl -sS -o "resp-$job.json" -w "%{http_code}" --max-time 100 \
              -X POST "https://sospana-sonke-api-fra.onrender.com/api/v1/cron/run/$job" \
              -H "X-Cron-Secret: $CRON_SECRET" || echo "000")
            echo "$job HTTP $code"
            cat "resp-$job.json" 2>/dev/null || true
            echo
            if [ "$code" != "200" ]; then
              echo "::error::$job returned HTTP $code."
              echo "404 means CRON_SECRET is unset on Render (sospana-sonke-api-fra → Environment)."
              echo "401 means the GitHub Actions secret does not match the Render value."
              echo "000 means the request timed out while the free instance was waking; the next 15-minute run retries."
              fail=1
            fi
          done
          # Listing text rules run once a day (daily-agent): that pass reads every
          # stored title and link, which every 15 minutes used up the Neon
          # free network allowance. Here only one batch of links is checked.
          code=$(curl -sS -o resp-check_listing_links.json -w "%{http_code}" --max-time 90 \
            -X POST "https://sospana-sonke-api-fra.onrender.com/api/v1/cron/run/check_listing_links" \
            -H "X-Cron-Secret: $CRON_SECRET" || echo "000")
          echo "check_listing_links HTTP $code"
          cat resp-check_listing_links.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            if grep -q "Unknown job" resp-check_listing_links.json 2>/dev/null; then
              echo "The Frankfurt API does not have the link-check job yet. Scanning continues."
            else
              echo "::error::check_listing_links returned HTTP $code."
              fail=1
            fi
          fi
          code=$(curl -sS -o resp-purge_expired_opportunities.json -w "%{http_code}" --max-time 300 \
            -X POST "https://sospana-sonke-api-fra.onrender.com/api/v1/cron/run/purge_expired_opportunities" \
            -H "X-Cron-Secret: $CRON_SECRET" || echo "000")
          echo "purge_expired_opportunities HTTP $code"
          cat resp-purge_expired_opportunities.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            if grep -q "Unknown job" resp-purge_expired_opportunities.json 2>/dev/null; then
              echo "The Frankfurt API does not have the purge job yet. Scanning continues."
            else
              echo "::error::purge_expired_opportunities returned HTTP $code."
              fail=1
            fi
          fi
          exit $fail
