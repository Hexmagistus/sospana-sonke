name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Dependency audit
        # Audits the pinned requirements (and what they install). setup-python
        # can build the temporary env pip-audit uses.
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Directory filter tests
        working-directory: frontend
        # Node 20 in this job cannot run TypeScript directly. Emit just these
        # two files, then run the plain test. No extra packages.
        run: npx tsc -p tsconfig.directory-filters.json && node --test /tmp/dir-filter-test/directoryFilters.test.js
      - name: Dependency audit
        working-directory: frontend
        # braces is installed from frontend/vendor/braces (3.0.4) and overrides
        # force every copy onto that one. Tailwind stays on 3.4.7.
        run: npm audit --audit-level=high
