name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Dependency audit
        working-directory: frontend
        # Production dependencies only. braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm)
        # comes from tailwindcss's file watcher, a devDependency. 3.0.3 is the
        # newest release and is still inside that range; `npm audit fix --force`
        # would install Tailwind 4. Vercel does not ship the Tailwind watcher.
        run: npm audit --omit=dev --audit-level=high
