name: Keep backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sS --max-time 45 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://sospana-sonke-api.onrender.com/health || echo "Ping failed - backend may have been mid cold-start; not failing the workflow."
