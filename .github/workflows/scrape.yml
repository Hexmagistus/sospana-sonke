# Content-change checks for careers pages that are not a structured job feed.
#
# Vacancy scanning itself is .github/workflows/scan.yml (every 15 minutes,
# via the Render cron endpoint). This workflow only asks the API whether
# those unstructured pages have changed, on a slower cadence, so the two
# jobs do not scan the same companies twice.
#
# ONE-TIME SETUP (the same CRON_SECRET as scan.yml):
#   1. Render dashboard → sospana-sonke-api → Environment → CRON_SECRET
#   2. GitHub → Settings → Secrets and variables → Actions → CRON_SECRET
# This job fails on purpose until that secret exists.

name: Check careers page changes

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: link-changes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set on this repository."
            echo "Add it under GitHub → Settings → Secrets and variables → Actions."
            echo "Use the same value as Render → sospana-sonke-api → Environment → CRON_SECRET."
            exit 1
          fi

      - name: Wake the API (Render free tier sleeps when idle)
        run: |
          curl -sS --max-time 90 -o /dev/null -w "wake status=%{http_code}\n" \
            https://sospana-sonke-api.onrender.com/health || true
          sleep 5

      - name: Check unstructured pages for changes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 100 \
            -X POST "https://sospana-sonke-api.onrender.com/api/v1/cron/run/check_link_changes" \
            -H "X-Cron-Secret: $CRON_SECRET" || echo "000")
          echo "HTTP $code"
          cat response.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::check_link_changes returned HTTP $code."
            echo "404 means CRON_SECRET is unset on Render. 401 means the GitHub secret does not match."
            exit 1
          fi
